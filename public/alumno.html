<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aula - ITC Aula Virtual</title>
  <meta name="description" content="Materiales de la capacitación">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0058FF">
  <link rel="icon" type="image/png" href="/img/icon-48.png">
  <link rel="icon" type="image/png" href="/img/icon-256.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/config.js"></script>
  <script src="/js/common.js"></script>
  <style>
    .alumno-main { max-width: 860px; margin: 0 auto; padding-bottom: 40px; }
    .alumno-hero {
      background: linear-gradient(135deg, var(--primary), #2563eb);
      color: #fff; border-radius: var(--radius); padding: 26px 24px; margin: 18px 0 22px;
    }
    .alumno-hero h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .alumno-hero p { opacity: .85; font-size: .9rem; margin: 0; }
    .alumno-clase {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 12px; overflow: hidden;
    }
    .alumno-clase > summary {
      display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer;
      font-weight: 800; list-style: none;
    }
    .alumno-clase > summary::-webkit-details-marker { display: none; }
    .alumno-clase > summary::after { content: '▸'; margin-left: auto; transition: transform .15s; color: var(--text-soft); }
    .alumno-clase[open] > summary::after { transform: rotate(90deg); }
    .alumno-modulo { font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--text-soft); font-weight: 800; padding: 16px 18px 6px; }
    .alumno-curso-titulo {
      margin: 26px 0 2px; font-size: 1.15rem; font-weight: 800;
      display: flex; align-items: center; gap: 6px;
      padding-bottom: 8px; border-bottom: 2px solid var(--border);
    }
    .alumno-curso-titulo:first-child { margin-top: 6px; }
    .alumno-archivo {
      display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--border);
    }
    .alumno-archivo .info { flex: 1 1 auto; min-width: 0; }
    .alumno-archivo .info b { display: block; font-size: .9rem; }
    .alumno-archivo .info small { color: var(--text-soft); font-size: .75rem; }
    .alumno-archivo .info .f-desc { display: block; color: var(--text-soft); font-size: .78rem; margin-top: 2px; font-style: italic; }
    .alumno-archivo .acciones { display: flex; gap: 8px; flex-shrink: 0; }
    /* —— Grilla de tarjetas de cursos (estilo panel docente) —— */
    .alumno-main.grid-vista { max-width: 1100px; }
    .btn-volver {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; margin: 2px 0 6px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font: inherit; font-size: .85rem; font-weight: 700;
      cursor: pointer;
    }
    .btn-volver:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .alumno-cursos-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px;
    }
    .alumno-curso-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s;
    }
    .alumno-curso-card:hover, .alumno-curso-card:focus-visible {
      transform: translateY(-3px); border-color: var(--primary);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .12); outline: none;
    }
    .alumno-curso-thumb {
      width: 100%; height: 132px; object-fit: cover; display: block; background: var(--surface-2);
    }
    .alumno-curso-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .alumno-curso-body b { font-size: .95rem; line-height: 1.25; }
    .alumno-curso-body small { color: var(--text-soft); font-size: .78rem; }
    .alumno-curso-foot { margin-top: auto; padding-top: 8px; }
    .alumno-curso-foot .btn { pointer-events: none; }
    /* —— Programa de estudios (presentación de materias) —— */
    .plan-curso {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; margin: 2px 0 16px;
    }
    .plan-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .plan-head b { display: block; font-size: 1rem; }
    .plan-head small { display: block; color: var(--text-soft); font-size: .78rem; }
    .plan-quien { font-size: .85rem; color: var(--text-soft); line-height: 1.45; margin: 0 0 10px; }
    .plan-quien b { color: var(--text); }
    .plan-modulos summary {
      cursor: pointer; font-weight: 800; font-size: .85rem; padding: 8px 0 4px; list-style: none;
      border-top: 1px solid var(--border);
    }
    .plan-modulos summary::-webkit-details-marker { display: none; }
    .plan-modulos summary::after { content: '▾'; color: var(--text-soft); margin-left: 6px; }
    .plan-modulos[open] summary::after { content: '▴'; }
    .plan-modulos-body { margin-top: 10px; }
    .plan-modulo {
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
      padding: 10px 14px 12px; margin-bottom: 10px;
    }
    .plan-modulo h4 { margin: 0 0 6px; font-size: .85rem; }
    .plan-modulo h4 small { color: var(--primary); font-weight: 800; font-size: .8rem; margin-left: 4px; }
    .plan-modulo ol { margin: 0; padding-left: 22px; font-size: .82rem; line-height: 1.55; color: var(--text-soft); }
    .plan-modulo ol li b { color: var(--text); }
    .alumno-buscar {
      display: flex; gap: 10px; margin: 0 0 16px;
    }
    .alumno-buscar input {
      flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font: inherit; font-size: .9rem;
    }
    .alumno-buscar input:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }
    .alumno-toolbar {
      display: flex; align-items: center; gap: 10px; margin: 0 0 16px; flex-wrap: wrap;
    }
    .alumno-toolbar .alumno-buscar { flex: 1; margin: 0; min-width: 200px; }
    .btn-toggle-todo {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font: inherit; font-size: .85rem; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    .btn-toggle-todo:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .alumno-curso-bloque { margin-bottom: 28px; }
    .alumno-progreso {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 12px 18px; margin: 10px 0 16px;
    }
    .alumno-progreso .p-info b { display: block; font-size: .88rem; }
    .alumno-progreso .p-info small { color: var(--text-soft); font-size: .75rem; }
    .alumno-progreso .p-barra {
      flex: 1; min-width: 120px; height: 8px; border-radius: 99px; background: var(--border); overflow: hidden;
    }
    .alumno-progreso .p-barra span {
      display: block; height: 100%; border-radius: 99px; background: var(--primary);
      transition: width .3s;
    }
    .btn-visto {
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text-soft);
      padding: 4px 12px 4px 5px; border-radius: 999px; cursor: pointer; flex-shrink: 0;
      font: inherit; font-size: .72rem; font-weight: 800; line-height: 1;
      transition: border-color .15s, background .15s, color .15s;
    }
    .btn-visto .v-icon {
      width: 17px; height: 17px; border: 1.5px solid var(--border); border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .62rem; background: var(--surface); color: var(--text-soft);
      transition: background .15s, border-color .15s;
    }
    .btn-visto .v-txt { white-space: nowrap; }
    .btn-visto:hover { border-color: var(--primary); color: var(--primary); outline: none; }
    .btn-visto:hover .v-icon { border-color: var(--primary); }
    .btn-visto:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    .btn-visto.ok {
      border-color: #25b266; color: #15803d;
      background: linear-gradient(90deg, rgba(37, 178, 102, .12), rgba(37, 178, 102, .05));
    }
    .btn-visto.ok .v-icon { background: #25b266; border-color: #25b266; color: #fff; }
    .alumno-clase.vista > summary { background: linear-gradient(90deg, rgba(37, 178, 102, .07), transparent 55%); }
    .alumno-clase.vista > summary .sum-txt { text-decoration: line-through; color: var(--text-soft); }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido</a>
  <header class="topbar" id="topbar"></header>

  <main class="container alumno-main" id="main">
    <section class="alumno-hero">
      <h1 id="alumnoSaludo">Mi aula</h1>
      <p id="alumnoCursoNombre">Cargando tu material…</p>
    </section>

    <div class="loading" id="loading"><span class="spinner" aria-hidden="true"></span> Cargando…</div>
    <div class="empty hidden" id="empty"></div>
    <div class="alumno-toolbar hidden" id="cajaBuscar">
      <div class="alumno-buscar"><input type="search" id="alumnoBuscar" placeholder="🔎 Buscar en tu aula… (clase o material)" aria-label="Buscar en tu aula"></div>
      <button type="button" class="btn-toggle-todo" id="btnExpandirTodo" title="Abrir o cerrar todas las clases">Expandir todo ▾</button>
    </div>
    <div id="cajaVolver" class="hidden">
      <button type="button" class="btn-volver" id="btnVolverCursos">← Volver a mis cursos</button>
    </div>
    <div id="grillaCursos"></div>
    <div id="cajaPrograma" class="hidden"></div>
    <div class="empty hidden" id="sinResultados"></div>
    <div id="listaMaterial"></div>
  </main>

  <!-- modal de interactivo -->
  <div class="modal-overlay hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <b id="modalTitle">Material</b>
        <button type="button" class="btn btn-ghost btn-sm" id="modalOpen">↗ Nueva pestaña</button>
        <button type="button" class="btn btn-primary btn-sm" id="modalClose">Cerrar ✕</button>
      </div>
      <div class="modal-body">
        <iframe id="modalFrame" title="Material" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups"></iframe>
      </div>
    </div>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>
  <footer class="site-firma">© Informatic Training Center — Todos los derechos reservados</footer>
  <script src="/js/alumno.js"></script>
</body>
</html>
