<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tipos de Contenidos que Funcionan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .text-shadow {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    iframe {
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1),
                  0 2px 4px -1px rgba(0,0,0,0.06);
    }
    .animate-fade-in {
      animation: fadeIn 0.7s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-800 via-purple-600 to-indigo-500 text-gray-100 p-4 sm:p-8 md:p-12 flex flex-col justify-between">

  <!-- Header -->
  <header class="text-center mb-6">
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-white text-shadow rounded-lg p-2 bg-purple-700 bg-opacity-70 inline-block">
      ✨ Tipos de Contenidos que Funcionan ✨
    </h1>
    <p class="mt-2 text-lg sm:text-xl text-purple-200 text-shadow">
      
    </p>
  </header>

  <!-- Main -->
  <main id="module-container" class="flex-grow flex items-center justify-center p-4"></main>

  <!-- Navigation -->
  <div class="flex justify-center gap-4 mt-6">
    <button id="prev-btn"
      class="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-300 focus:ring-opacity-75">
      Anterior ⬅️
    </button>
    <button id="next-btn"
      class="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-300 focus:ring-opacity-75">
      Siguiente ➡️
    </button>
  </div>

  <!-- Footer -->
  <footer class="mt-6 text-center text-purple-200 text-shadow text-base sm:text-lg">
    <p class="bg-purple-800 bg-opacity-70 p-2 rounded-lg inline-block">
      © Todos los derechos reservadospara GKempe UDEMM/ITC ARG 2026
    </p>
  </footer>

  <!-- Script -->
  <script>
    const modulesData = [
      { id: 1, title: "Diferencia de Videos Cortos en Instagram y TikTok 📱", media: "https://i.postimg.cc/SRLVY1kB/1.png", mediaType: "image" },
      { id: 2, title: "Mismo Video, Diferente Resultado 🔄", media: "https://i.postimg.cc/zXQQK6rh/2.png", mediaType: "image" },
      { id: 3, title: "Tipos de Contenidos 📚", media: "https://i.postimg.cc/nzD3pc5c/3.png", mediaType: "image" },
      { id: 4, title: "Contenidos que Sirven ✅", media: "https://i.postimg.cc/wB3W4kQN/4.png", mediaType: "image" },
      { id: 5, title: "Tipos de Contenido que Funcionan en Video 🎬", media: "https://i.postimg.cc/CKtc3fcQ/5.png", mediaType: "image" },
      { id: 6, title: "Formatos de Videos 🎥", media: "https://i.postimg.cc/Qt2nTW5T/6.png", mediaType: "image" },
      { id: 7, title: "¿Qué es lo Importante? 🤔", media: "https://i.postimg.cc/d1kx397F/7.png", mediaType: "image" },
      { id: 8, title: "Gancho, Desarrollo y Cierre ✍️", media: "https://i.postimg.cc/sx5H9D90/8.png", mediaType: "image" },
      { id: 9, title: "Ejemplo ▶️", media: "https://www.youtube.com/embed/pspvHkb0zew", mediaType: "video" },
      { id: 10, title: "Tipos de Hook (Ganchos) 🎣", media: "https://i.postimg.cc/MZBL8d2b/10.png", mediaType: "image" }
    ];

    let currentModuleIndex = 0;
    const container = document.getElementById("module-container");

    function renderModule(index) {
      const mod = modulesData[index];
      container.innerHTML = `
        <section class="bg-purple-900 bg-opacity-50 backdrop-filter backdrop-blur-sm rounded-xl shadow-xl p-6 sm:p-8 md:p-10 border border-purple-700 flex flex-col items-center text-center max-w-2xl w-full transition-all duration-500 ease-in-out hover:shadow-2xl hover:border-purple-500 animate-fade-in">
          <h2 class="text-2xl sm:text-3xl font-bold mb-4 text-purple-200 text-shadow">${mod.title}</h2>
          ${mod.mediaType === "image" 
            ? `<img src="${mod.media}" alt="Módulo ${mod.id}: ${mod.title}"
                class="w-full max-w-md h-auto rounded-lg shadow-md mb-6 border-2 border-purple-500 object-cover"
                onerror="this.onerror=null;this.src='https://placehold.co/600x400/8b5cf6/ffffff?text=Imagen+no+disponible';" />`
            : `<div class="w-full max-w-md aspect-video mb-6">
                <iframe src="${mod.media}" title="Módulo ${mod.id}: ${mod.title}" frameborder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen
                  class="w-full h-full rounded-lg"></iframe>
               </div>`}
        </section>
      `;
    }

    document.getElementById("next-btn").addEventListener("click", () => {
      currentModuleIndex = (currentModuleIndex + 1) % modulesData.length;
      renderModule(currentModuleIndex);
    });

    document.getElementById("prev-btn").addEventListener("click", () => {
      currentModuleIndex = (currentModuleIndex - 1 + modulesData.length) % modulesData.length;
      renderModule(currentModuleIndex);
    });

    // Inicial
    renderModule(currentModuleIndex);
  </script>
</body>
</html>
