<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuestionario — Clase 3</title>
<style>
:root{--mag:#FF2ED1;--cian:#22E0FF;--txt:#EAF2FF;--fondo:#070A1A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 600px at 10% 90%,#3A0B4A 0%,#0B1030 45%,#070A1A 100%);
     color:var(--txt);font-family:'Segoe UI',Arial,sans-serif;padding:32px 18px}
.envoltorio{max-width:820px;margin:0 auto}
.kicker{color:var(--cian);letter-spacing:4px;font-size:12px}
h1{font-size:34px;margin:6px 0 4px;text-shadow:0 0 28px rgba(34,224,255,.4)}
.sub{color:#A9B7C6;margin:0 0 24px;font-size:15px}
.pregunta{background:rgba(11,16,48,.75);border:1px solid rgba(34,224,255,.25);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.pregunta h2{font-size:16px;margin:0 0 10px;color:#fff}
.opcion{display:flex;gap:10px;align-items:center;padding:8px 11px;border-radius:6px;cursor:pointer;margin-bottom:5px;border:1px solid transparent}
.opcion:hover{background:rgba(34,224,255,.08)}
.opcion input{accent-color:var(--mag);width:16px;height:16px}
.opcion.bien{border-color:#22E0FF;background:rgba(34,224,255,.14)}
.opcion.mal{border-color:#FF2ED1;background:rgba(255,46,209,.14)}
.explica{display:none;margin-top:8px;font-size:13px;color:#C9D6EA;border-left:3px solid var(--cian);padding-left:10px}
.explica.visible{display:block}
.barra{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(7,10,26,.95);padding:14px 0}
button{background:linear-gradient(90deg,var(--mag),#B03BFF);color:#fff;border:0;padding:12px 22px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 0 22px rgba(255,46,209,.4)}
button.sec{background:rgba(34,224,255,.12);color:var(--cian);border:1px solid rgba(34,224,255,.5);box-shadow:none}
.puntaje{font-size:15px;color:var(--cian);font-weight:700}
a{color:var(--cian)}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:50}
.feliz{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:51;pointer-events:none}
.feliz.on{display:flex}
.feliz .caja{background:rgba(7,10,26,.9);border:2px solid var(--cian);border-radius:16px;padding:26px 44px;text-align:center;box-shadow:0 0 60px rgba(34,224,255,.55)}
.feliz h2{margin:0;font-size:40px;text-shadow:0 0 30px var(--mag)}
.feliz p{margin:6px 0 0;color:var(--cian)}
</style>
</head>
<body>
<div class="envoltorio">
  <div class="kicker">DIAGNÓSTICO Y MANTENIMIENTO · PRÁCTICA 03</div>
  <h1>Microprocesadores</h1>
  <p class="sub">Trece preguntas. <a href="res/1_Practica Clase 3 - Microprocesadores.pdf">Ver la práctica en PDF</a></p>
  <form id="cuestionario"></form>
  <div class="barra">
    <span class="puntaje" id="puntaje"></span>
    <div><button type="button" class="sec" id="reiniciar">Reiniciar</button>
    <button type="button" id="corregir">Corregir</button></div>
  </div>
</div>
<canvas id="confeti"></canvas>
<div class="feliz" id="feliz"><div class="caja"><h2>¡FELICITACIONES!</h2><p>13 de 13 correctas</p></div></div>
<script>
const preguntas = [
 {q:"En un Intel Core i5-12400F, ¿qué significa la letra F del final?", o:["Que es de bajo consumo","Que no tiene video integrado","Que está desbloqueado para overclock","Que es de gama alta"], c:1,
  e:"F = sin gráficos integrados. Necesita una placa de video dedicada o una placa con salida de video propia."},
 {q:"En el mismo i5-12400F, ¿qué indica el 12?", o:["Los núcleos","La generación","La frecuencia","El zócalo"], c:1,
  e:"El primer número después de la gama es la generación: 12ª. Cuanto más nueva, más moderno y eficiente."},
 {q:"Un Ryzen 5 5600G tiene 6 núcleos con SMT. ¿Cuántos hilos muestra el sistema?", o:["6","8","12","24"], c:2,
  e:"SMT da dos hilos por núcleo físico: 6 × 2 = 12 hilos. Los hilos son virtuales, no duplican el rendimiento."},
 {q:"¿En qué zócalo va un Ryzen 5 5600G?", o:["AM4","AM5","LGA1700","LGA1200"], c:0,
  e:"Ryzen 5000 usa AM4 (PGA, pines en el procesador). AM5 es para Ryzen 7000 y 9000; LGA1700 es de Intel."},
 {q:"¿En qué zócalo va un Core i5-12400F?", o:["AM4","LGA1200","LGA1700","LGA1851"], c:2,
  e:"12ª y 13ª generación usan LGA1700, con los pines en la placa. LGA1851 es para Core Ultra."},
 {q:"¿Cuál es la memoria caché más rápida del procesador?", o:["L1","L2","L3","La RAM"], c:0,
  e:"L1 es la más chica y la más rápida; L3 es la más grande y se comparte entre los núcleos."},
 {q:"¿Qué hace Hyper-Threading (Intel) o SMT (AMD)?", o:["Duplica los núcleos físicos","Hace que un núcleo atienda dos hilos","Sube la frecuencia sola","Agrega memoria caché"], c:1,
  e:"Un núcleo físico aparece como dos procesadores lógicos. Mejora la multitarea, no duplica el rendimiento."},
 {q:"El cooler no alcanza y el procesador está en Turbo. ¿Qué hace?", o:["Se apaga de golpe","Baja la frecuencia solo (throttling)","Sube el voltaje","Usa más RAM"], c:1,
  e:"Turbo solo se mantiene si la temperatura y el consumo lo permiten. Si no, baja la frecuencia para protegerse."},
 {q:"¿Qué arquitectura permite usar más de 4 GB de RAM?", o:["32 bits","64 bits","16 bits","8 bits"], c:1,
  e:"32 bits direcciona hasta 4 GB. Un Windows de 32 bits no ve más, aunque la PC tenga 12 GB instalados."},
 {q:"¿Qué parte del procesador es la pastilla de silicio donde están los transistores?", o:["El IHS","El sustrato","El DIE","El zócalo"], c:2,
  e:"El DIE es el silicio con núcleos, caché, ALU y FPU. El IHS es la tapa metálica y el sustrato, la placa verde."}
,
{q:"En CPU-Z, ¿qué muestra Core Speed?", o:["La velocidad máxima del procesador","La frecuencia real en ese momento","Los núcleos","La caché"], c:1,
  e:"Core Speed cambia con la carga: es la frecuencia a la que está trabajando en ese instante."},
 {q:"¿Dónde se pone la pasta térmica?", o:["Cubriendo todo el IHS","En el centro, del tamaño de un grano de arroz","En los contactos","En la base del gabinete"], c:1,
  e:"En el centro: el cooler la reparte. El exceso se derrama y ensucia alrededor."},
 {q:"¿Un cooler mejor hace más rápido al procesador?", o:["Sí, siempre","No: evita que baje la frecuencia por calor","Solo en AMD","Solo con overclock"], c:1,
  e:"No cambia la velocidad del procesador: evita el throttling y el ruido."}
];
const cont = document.getElementById('cuestionario');
preguntas.forEach((p,i)=>{
  const d=document.createElement('div'); d.className='pregunta';
  d.innerHTML='<h2>'+(i+1)+'. '+p.q+'</h2>'+p.o.map((o,k)=>'<label class="opcion" data-k="'+k+'"><input type="radio" name="p'+i+'" value="'+k+'">'+o+'</label>').join('')+'<div class="explica" id="e'+i+'">'+p.e+'</div>';
  cont.appendChild(d);
});
function corregir(){
  let bien=0;
  preguntas.forEach((p,i)=>{
    const sel=document.querySelector('input[name="p'+i+'"]:checked');
    const labels=document.querySelectorAll('.pregunta')[i].querySelectorAll('.opcion');
    labels.forEach(l=>l.classList.remove('bien','mal'));
    if(!sel) return;
    const k=Number(sel.value);
    if(k===p.c){bien++;labels[k].classList.add('bien');} else {labels[k].classList.add('mal');labels[p.c].classList.add('bien');}
    document.getElementById('e'+i).classList.add('visible');
  });
  document.getElementById('puntaje').textContent=bien+' de '+preguntas.length+' correctas';
  if(bien===preguntas.length) festejar(); else ocultar();
}
function ocultar(){document.getElementById('feliz').classList.remove('on');animando=false;}
let animando=false;
function festejar(){
  document.getElementById('feliz').classList.add('on');
  const cv=document.getElementById('confeti'), ctx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const col=['#FF2ED1','#22E0FF','#FFFFFF','#FFD60A','#B03BFF'], pz=[];
  for(let i=0;i<220;i++) pz.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.6,w:6+Math.random()*7,h:10+Math.random()*12,vx:(Math.random()-.5)*2.2,vy:2+Math.random()*3.5,a:Math.random()*Math.PI,va:(Math.random()-.5)*.22,c:col[Math.floor(Math.random()*col.length)]});
  animando=true; const fin=Date.now()+5200;
  (function paso(){
    if(!animando) return;
    ctx.clearRect(0,0,cv.width,cv.height);
    pz.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.vy+=0.02;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();if(p.y>cv.height+20&&Date.now()<fin){p.y=-20;p.vy=2+Math.random()*3;}});
    if(Date.now()<fin) requestAnimationFrame(paso); else {ctx.clearRect(0,0,cv.width,cv.height);animando=false;}
  })();
}
document.getElementById('corregir').onclick=corregir;
document.getElementById('reiniciar').onclick=()=>{document.getElementById('cuestionario').reset();document.querySelectorAll('.opcion').forEach(l=>l.classList.remove('bien','mal'));document.querySelectorAll('.explica').forEach(e=>e.classList.remove('visible'));document.getElementById('puntaje').textContent='';ocultar();};
</script>
</body>
</html>
