<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Explorador de Arduino por Facu</title>
  <style>
    body {
      background: #0a0a1a;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h2 {
      font-size: 2.5em;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
    }
    p {
        max-width: 600px;
    }
    .board-container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }
    .board-container img {
      max-width: 600px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,255,204,0.5);
    }
    .hotspot {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #00ffcc;
      border: 2px solid #fff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 12px #00ffcc;
      transform: translate(-50%, -50%);
      transition: all 0.2s ease-in-out;
    }
    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.4);
      background: #ff0055;
      border-color: #ff0055;
      box-shadow: 0 0 15px #ff0055;
    }
    .tooltip {
      position: fixed;
      background: rgba(0,0,0,0.9);
      border: 2px solid #00ffcc;
      padding: 10px;
      border-radius: 8px;
      max-width: 250px;
      text-align: left;
      display: none;
      z-index: 1000;
      pointer-events: none;
    }
    .tooltip h3 {
      margin: 0 0 5px;
      color: #00ffcc;
      font-size: 1.1em;
    }
    .tooltip p {
      margin: 0;
    }
  </style>
</head>
<body>
  <h2>🔍 Explorador de Arduino por Facu</h2>
  <p>Hacé clic en los puntos brillantes para reconocer que son las partes más importante de una placa Arduino R3.</p>
  
  <div class="board-container">
    <img src="https://i.postimg.cc/qRwrBWjq/Gemini-Generated-Image-wrpbmqwrpbmqwrpb-removebg-preview.png" alt="Placa Arduino estilizada">
    
    <div class="hotspot" style="top: 40%; left: 12%;" data-title="Puerto USB" data-text="Conecta a la PC para darle energía y cargarle programas."></div>
    <div class="hotspot" style="top: 70%; left: 11%;" data-title="Jack de Alimentación" data-text="Alternativa para energizar la placa con una batería o transformador."></div>
    <div class="hotspot" style="top: 60%; left: 65%;" data-title="Microcontrolador (ATmega328P)" data-text="El cerebro de la placa. Aquí se ejecuta tu código."></div>
    <div class="hotspot" style="top: 60%; left: 20%;" data-title="Regulador de Voltaje" data-text="Asegura que el cerebro reciba un voltaje estable y seguro de 5V."></div>
    <div class="hotspot" style="top: 54%; left: 30%;" data-title="Cristal de Cuarzo (16MHz)" data-text="El corazón de la placa. Marca el ritmo al que trabaja el cerebro."></div>
    <div class="hotspot" style="top: 19%; left: 20%;" data-title="Botón de Reset" data-text="Reinicia tu programa desde el principio sin borrarlo."></div>
    <div class="hotspot" style="top: 18%; left: 60%;" data-title="Pines Digitales (0-13)" data-text="Leen o escriben dos estados: ENCENDIDO o APAGADO."></div>
    <div class="hotspot" style="top: 80%; left: 78%;" data-title="Pines Analógicos (A0-A5)" data-text="Leen un rango de valores. Ideales para sensores de luz o temperatura."></div>
    <div class="hotspot" style="top: 80%; left: 48%;" data-title="Pines de Energía" data-text="Proveen voltaje (5V, 3.3V) y tierra (GND) para tu circuito."></div>
    <div class="hotspot" style="top: 18%; left: 70%;" data-title="Pines PWM (~)" data-text="Pines digitales especiales que pueden regular intensidad (ej. brillo de un LED)."></div>
  </div>

  <div class="tooltip" id="tooltip">
    <h3 id="tooltip-title"></h3>
    <p id="tooltip-text"></p>
  </div>

  <script>
    const hotspots = document.querySelectorAll('.hotspot');
    const tooltip = document.getElementById('tooltip');
    const title = document.getElementById('tooltip-title');
    const text = document.getElementById('tooltip-text');

    hotspots.forEach(h => {
      h.addEventListener('click', (e) => {
        e.stopPropagation(); 
        
        title.textContent = h.dataset.title;
        text.textContent = h.dataset.text;
        
        tooltip.style.display = 'block';
        // CAMBIO 1: Ahora pasamos el elemento 'h' (el hotspot) en lugar del evento 'e'.
        updateTooltipPosition(h); 
      });
    });

    document.addEventListener('click', () => {
      tooltip.style.display = 'none';
    });

    // CAMBIO 2: La función ahora recibe 'hotspot' como parámetro.
    function updateTooltipPosition(hotspot) {
      const offset = 10; // Espacio entre el hotspot y el tooltip
      const tooltipWidth = tooltip.offsetWidth;
      const tooltipHeight = tooltip.offsetHeight;
      
      // Obtenemos la posición y tamaño del hotspot en la pantalla.
      const hotspotRect = hotspot.getBoundingClientRect();

      // ---- NUEVA LÓGICA DE POSICIONAMIENTO ----
      // 1. Centramos horizontalmente con el hotspot.
      // (Posición izquierda del hotspot + la mitad de su ancho) - la mitad del ancho del tooltip.
      let left = (hotspotRect.left + hotspotRect.width / 2) - (tooltipWidth / 2);

      // 2. Posicionamos arriba del hotspot.
      // Posición superior del hotspot - la altura del tooltip - el offset.
      let top = hotspotRect.top - tooltipHeight - offset;

      // ---- AJUSTES PARA BORDES DE PANTALLA (se mantienen) ----
      // Si se sale por la izquierda, lo alineamos a la izquierda.
      if (left < 0) {
          left = offset;
      }
      // Si se sale por la derecha, lo alineamos a la derecha.
      if (left + tooltipWidth > window.innerWidth) {
          left = window.innerWidth - tooltipWidth - offset;
      }
      // Si se sale por arriba, lo mostramos ABAJO del hotspot.
      if (top < 0) {
          top = hotspotRect.bottom + offset;
      }
      
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    }
  </script>
</body>
</html>
