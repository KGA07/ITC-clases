<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1366px;height:720px;font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 50% 30%,#2b3a67,#101a30 70%);overflow:hidden;color:#dce4f5}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center}
.logo{display:flex;align-items:center;justify-content:center;gap:16px;font-size:40px;margin-bottom:6px}
.circle{width:60px;height:14px;border-radius:50%;background:#ff7a26;box-shadow:0 0 0 3px #00000040}
.pendrive-main{margin:26px auto 0;width:300px;height:60px;background:linear-gradient(180deg,#2c3b63,#141f3a);border-radius:12px;border:1px solid #46568a;display:flex;align-items:center;box-shadow:0 10px 30px #0008}
.if{width:90px;height:20px;background:#9aa7c9;border-radius:2px;margin-left:-2px}
.label{padding-left:16px;text-align:left;font-size:13px;color:#9fb0d4}
.label b{color:#fff}
.ring{position:absolute;inset:-30px;left:50%;margin-left:-150px;width:300px;height:120px;border-radius:50%;border:2px dashed #ffffff30;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:13px;color:#8fa2cc}
.hint b{color:#ffb46e}
.steps{display:flex;gap:8px;justify-content:center;margin-top:16px;font-size:12px;color:#50608b}
.steps div{width:8px;height:8px;border-radius:50%;background:#3c4c77}
.steps div.on{background:#ff7a26}
</style></head><body>
<div class="center">
  <div class="logo"><span style="font-size:46px">🐧</span><span style="font-weight:700;font-size:30px;color:#ff7a26">Ubuntu</span></div>
  <div style="font-size:16px">Pendrive Linux <b>Live</b> · Recuperación del sistema</div>
  <div class="pendrive-main">
    <div class="if"></div>
    <div class="label">Ubuntu <b>24.04 LTS</b><br>live · persistente · herramientas de recuperación</div>
  </div>
  <div class="steps"><div class="on"></div><div></div><div></div><div></div></div>
</div>
<div class="hint">Inicie desde el pendrive (F12 / F2 / Esc) → <b>Probar Ubuntu</b> → recupere archivos, repare GRUB o reinstale el sistema.</div>
</body></html>
